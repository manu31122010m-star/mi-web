<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b2128">
  <meta name="description" content="Organiza tus rutinas de gimnasio con ejercicios animados, mapa muscular, entreno en vivo, historial y progreso.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mi Gym">
  <title>Mi Gym</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main id="view"></main>
  <div id="mini" hidden></div>
  <nav class="nav">
    <button data-act="tab" data-tab="hoy"><span>🏠</span>Hoy</button>
    <button data-act="tab" data-tab="rutinas"><span>📋</span>Rutinas</button>
    <button data-act="tab" data-tab="ejercicios"><span>🏋️</span>Ejercicios</button>
    <button data-act="tab" data-tab="gymbro" class="bro-tab"><img src="icons/icon-192.png" alt="">GymBro</button>
    <button data-act="tab" data-tab="historial"><span>📈</span>Historial</button>
    <button data-act="tab" data-tab="perfil"><span>👤</span>Perfil</button>
  </nav>
  <section id="live" hidden></section>
  <div id="sheet" hidden></div>
  <div id="rest" hidden></div>
  <div id="menu" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="js/data.js"></script>
  <script src="js/anim.js"></script>
  <script src="js/gymbro.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
